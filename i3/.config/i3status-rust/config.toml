[theme]
theme = "plain"

[theme.overrides]
idle_fg = "#979eab"
idle_bg = "#282c34"
info_fg = "#61afef"
info_bg = "#282c34"
warning_fg = "#d19a66"
warning_bg = "#282c34"
critical_fg = "#e06c75"
critical_bg = "#282c34"
separator_fg = "#393e48"
separator_bg = "#282c34"
separator = "|"

[[block]]
block = "cpu"
info_cpu = 20 
warning_cpu = 50
critical_cpu = 90
format = " cpu: $utilization "

[[block]]
block = "memory"
format = " memory: $mem_used_percents.eng(w:2) "

[[block]]
block = "sound"
format = " volume: {$volume.eng(w:2) |}"

[[block]]
block = "disk_space"
path = "/"
info_type = "available"
alert_unit = "GB"
interval = 20
warning = 20.0
alert = 10.0
format = " root: $available.eng(w:2) "

[[block]]
block = "disk_space"
path = "/home"
info_type = "available"
alert_unit = "GB"
interval = 20
warning = 20.0
alert = 10.0
format = " home: $available.eng(w:2) "

[[block]]
block = "time"
interval = 5
format = " $timestamp.datetime(f:'%d/%m %R') "
