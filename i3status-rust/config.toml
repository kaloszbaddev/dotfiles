[theme]
theme = "plain"

[theme.overrides]
idle_fg = "#ffffff"
idle_bg = "#285577"
info_bg = "#4c7899"
info_fg = "#ffffff"
warning_bg = "#bd8935"
warning_fg = "#ffffff"
critical_bg = "#900000"
critical_fg = "#ffffff"
separator = "|"
separator_bg = "#002b36"

[[block]]
block = "cpu"
info_cpu = 20
warning_cpu = 50
critical_cpu = 90
format = " Cpu: $utilization "

[[block]]
block = "memory"
format = " Memory: $mem_used_percents.eng(w:2) "

[[block]]
block = "sound"
format = " Volume: {$volume.eng(w:2) |}"

[[block]]
block = "disk_space"
path = "/"
info_type = "available"
alert_unit = "GB"
interval = 20
warning = 20.0
alert = 10.0
format = " Root: $available.eng(w:2) "

[[block]]
block = "disk_space"
path = "/home"
info_type = "available"
alert_unit = "GB"
interval = 20
warning = 20.0
alert = 10.0
format = " Home: $available.eng(w:2) "

[[block]]
block = "time"
interval = 5
format = " $timestamp.datetime(f:'%a %d/%m %R') "
